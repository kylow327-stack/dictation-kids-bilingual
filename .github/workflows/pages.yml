name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble monolith index.html
        run: |
          set -euo pipefail
          if ls build/gz*.hex >/dev/null 2>&1; then
            cat $(ls build/gz*.hex | sort) | xxd -r -p | gunzip > index.html
            echo "Assembled from gz hex bytes=$(wc -c < index.html)"
          elif ls build/mono.part*.b64 >/dev/null 2>&1; then
            cat $(ls build/mono.part*.b64 | sort) | tr -d '\n' | base64 -d | gunzip > index.html
            echo "Assembled from mono b64 bytes=$(wc -c < index.html)"
          else
            test -f index.html
          fi
          grep -q 'dictation-bi-v4' index.html
          grep -q 'dictLangGet' index.html
          if grep -q 'getDictLang' index.html; then echo FORBIDDEN; exit 1; fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
